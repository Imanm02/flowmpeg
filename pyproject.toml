[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowmpeg"
version = "0.1.0"
description = "Readable media job plans for FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ImanM02" },
]
keywords = ["audio", "ffmpeg", "media", "video"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
flowmpeg = "flowmpeg.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[project.urls]
Changelog = "https://github.com/Imanm02/flowmpeg/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Imanm02/flowmpeg#readme"
Issues = "https://github.com/Imanm02/flowmpeg/issues"
Repository = "https://github.com/Imanm02/flowmpeg"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmpeg"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: calls local FFmpeg or FFprobe binaries",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["flowmpeg"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
