name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: flowmpeg --version
      - run: python -m flowmpeg --version
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests examples
      - run: >-
          python -m pytest -m "not integration"
          --cov=flowmpeg --cov-report=term-missing --cov-fail-under=75
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --no-index --find-links dist flowmpeg
      - run: wheel-test/bin/flowmpeg --version
      - run: wheel-test/bin/python -m flowmpeg --version

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: flowmpeg --version
      - run: python -m pytest -m "not integration"

  integration-tests:
    name: FFmpeg integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m integration
