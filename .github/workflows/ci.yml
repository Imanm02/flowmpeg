name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --extra dev
      - run: uv run --frozen flowmpeg --version
      - run: uv run --frozen python -m flowmpeg --version
      - run: uv run --frozen python -m ruff check .
      - run: uv run --frozen python -m ruff format --check .
      - run: uv run --frozen python -m mypy src tests examples
      - run: >-
          uv run --frozen python -m pytest -m "not integration"
          --cov=flowmpeg --cov-report=term-missing --cov-fail-under=75
      - run: uv build --wheel --out-dir dist
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --no-index --find-links dist flowmpeg
      - run: wheel-test/bin/flowmpeg --version
      - run: wheel-test/bin/python -m flowmpeg --version

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --extra dev
      - run: uv run --frozen flowmpeg --version
      - run: uv run --frozen python -m pytest -m "not integration"

  integration-tests:
    name: FFmpeg integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: uv sync --locked --extra dev
      - run: uv run --frozen python -m pytest -m integration
